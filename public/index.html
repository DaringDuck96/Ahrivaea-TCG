  --felt: #2a160b;
  --felt-2: #3a2012;
  --rail: rgba(30,17,9,.9);
  --mat: rgba(16,9,5,.3);
  --parch: #f1e7cf;
  --parch-2: #e4d6b4;
  --ink: #2b221c;
  --brass: #caa24c;
  --brass-hi: #ecc96d;
  --slate: #d2bf9b;
  --danger: #d4553f;
  --good: #6cc48a;
  --serif: "Palatino Linotype", "Book Antiqua", Palatino, "URW Palladio L", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { background: var(--felt) var(--table) center / cover fixed no-repeat; color: #f4eadb; font-family: var(--sans); font-size: 14px; }
button { font: inherit; cursor: pointer; border-radius: 6px; border: 1px solid var(--brass); background: var(--brass); color: #1d1607; padding: 7px 14px; font-weight: 600; }
button:hover:not(:disabled) { background: var(--brass-hi); }
button:disabled { opacity: .45; cursor: not-allowed; }
button.ghost { background: transparent; color: var(--brass-hi); }
button:focus-visible, .card:focus-visible { outline: 2px solid var(--brass-hi); outline-offset: 2px; }

/* ---------- setup ---------- */
.setup { max-width: 760px; margin: 40px auto; padding: 36px 32px; background: rgba(24,13,7,.82); border: 1px solid rgba(202,162,76,.5); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.55); }
.setup h1 { font-family: var(--serif); font-size: 44px; font-weight: 600; margin: 0 0 6px; color: var(--parch); letter-spacing: .5px; }
.setup .sub { color: var(--slate); margin: 0 0 32px; font-size: 16px; line-height: 1.5; }
.seats { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 20px; }
.seat { background: rgba(0,0,0,.28); border: 1px solid rgba(202,162,76,.35); border-radius: 10px; padding: 16px; }
.seat label { display: block; color: var(--slate); font-size: 13px; margin: 0 0 4px; }
.seat input, .seat select { width: 100%; font: inherit; padding: 8px 10px; border-radius: 6px; border: 1px solid #6b4a2a; background: #1a0f08; color: #fff; margin-bottom: 12px; }
.seat .hp { font-family: var(--serif); font-size: 15px; color: var(--parch); line-height: 1.45; min-height: 66px; }
.chk { display: flex; gap: 10px; align-items: flex-start; color: #eadcc4; margin: 4px 0 24px; line-height: 1.4; }
.quick { margin-top: 36px; color: #e6d8bf; line-height: 1.6; font-size: 14.5px; }
.quick h2 { font-family: var(--serif); color: var(--parch); font-weight: 600; font-size: 22px; margin: 0 0 8px; }
.quick ol { padding-left: 20px; margin: 0; }
.quick li { margin-bottom: 4px; }

/* ---------- table ---------- */
#game { display: grid; grid-template-columns: minmax(0, 1fr) 290px; height: 100vh; }
#board { display: flex; flex-direction: column; gap: 8px; padding: 10px; overflow: auto; }
.side { display: flex; flex-direction: column; gap: 10px; padding: 10px 10px 10px 0; min-height: 0; }
.parea { display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; align-items: flex-start; flex-wrap: wrap; }
.battlefield { min-height: 168px; align-content: flex-start; padding: 8px; border-radius: 14px; background: var(--mat); border: 1px solid rgba(232,190,110,.32); box-shadow: inset 0 0 30px rgba(0,0,0,.45); }
.battlefield.empty::after { content: attr(data-empty); color: rgba(232,210,170,.55); font-size: 13px; align-self: center; padding: 8px; }
.relics { gap: 6px; }
.handrow { min-height: 64px; }
.tablerow { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 8px; align-items: stretch; }
.hcol { display: flex; flex-direction: column; gap: 6px; }
.parea.top .tablerow .battlefield { align-content: flex-end; }
.sep { width: 1px; align-self: stretch; background: rgba(154,161,192,.3); margin: 0 4px; }
.ohand { display: flex; flex-wrap: wrap; gap: 4px; }
.ohand .back { width: 26px; height: 36px; border-radius: 4px; }

/* hero */
.hero { width: 100%; border-radius: 12px; padding: 10px 12px; background: linear-gradient(160deg, color-mix(in srgb, var(--fc) 60%, #1a0e07), #1a0e07 85%); box-shadow: 0 6px 18px rgba(0,0,0,.5); border: 2px solid color-mix(in srgb, var(--fc) 70%, #000); cursor: default; position: relative; }
.hero.cand { cursor: pointer; box-shadow: 0 0 0 3px var(--good), 0 0 18px rgba(108,196,138,.6); }
.hero .hname { font-family: var(--serif); font-size: 16px; font-weight: 600; color: #fff; line-height: 1.2; }
.hero .who { color: #e6dac6; font-size: 12.5px; margin-top: 2px; }
.hero .life { position: absolute; right: 10px; top: 8px; font-family: var(--serif); font-size: 28px; font-weight: 700; color: #fff; }
.hero .life.low { color: #ff9b88; }
.hero .awk { margin-top: 6px; font-size: 12.5px; color: #efe5d2; line-height: 1.35; }
.hero .awk b { color: var(--brass-hi); font-weight: 600; }
.hero .pw { margin-top: 8px; font-size: 12.5px; line-height: 1.35; color: #f4f0ff; }
.hero .pw button { width: 100%; text-align: left; font-size: 12.5px; padding: 6px 8px; line-height: 1.3; }
.hero .zones { margin-top: 6px; font-size: 12px; color: var(--slate); }
.badge-aw { display: inline-block; margin-left: 4px; font-size: 11px; background: var(--brass); color: #1d1607; padding: 1px 6px; border-radius: 10px; font-family: var(--sans); vertical-align: 2px; }

/* well */
.well { border-radius: 10px; padding: 6px 8px; background: rgba(20,11,6,.72); border: 1px solid rgba(232,190,110,.25); }
.well .wl { font-size: 12px; color: var(--slate); margin-bottom: 4px; }
.well .wl b { color: #fff; }
.wtiles { display: flex; flex-wrap: wrap; gap: 4px; }
.wt { font-size: 10.5px; padding: 2px 6px; border-radius: 5px; background: color-mix(in srgb, var(--fc) 60%, #1a0e07); color: #fff; border: 1px solid color-mix(in srgb, var(--fc) 80%, #000); white-space: nowrap; max-width: 118px; overflow: hidden; text-overflow: ellipsis; cursor: default; }
.wt.tap { opacity: .38; }
.wt.cand { cursor: pointer; box-shadow: 0 0 0 2px var(--good); }

/* cards */
.card { --w: 108px; width: var(--w); height: calc(var(--w) * 1.42); border-radius: 8px; background: linear-gradient(180deg, var(--parch), var(--parch-2)); color: var(--ink); position: relative; border: 3px solid var(--fc); box-shadow: 0 4px 10px rgba(0,0,0,.6); display: flex; flex-direction: column; font-size: 9.5px; overflow: hidden; flex: 0 0 auto; cursor: default; transition: transform .12s ease; }
.card .hd { background: var(--fc); color: #fff; padding: 3px 4px 4px; display: flex; justify-content: space-between; gap: 3px; align-items: flex-start; }
.card .nm { font-family: var(--serif); font-weight: 700; font-size: 10.5px; line-height: 1.1; }
.card .cost { font-size: 10px; white-space: nowrap; background: rgba(0,0,0,.25); border-radius: 8px; padding: 0 4px; }
.card .ty { font-size: 8.5px; color: #6e6155; padding: 2px 5px 1px; }
.card .tx { padding: 1px 5px; flex: 1; overflow: hidden; line-height: 1.22; font-family: var(--serif); font-size: 9.5px; }
.card .bd { padding: 0 5px 2px; display: flex; flex-wrap: wrap; gap: 2px; }
.card .bd span { background: #2b221c; color: #f6efe0; border-radius: 4px; padding: 0 3px; font-size: 9px; line-height: 13px; }
.card .bd span.mk { background: var(--danger); }
.card .st { position: absolute; bottom: 3px; right: 3px; font-weight: 800; font-size: 13px; background: #2b221c; color: #fff; border-radius: 6px; padding: 1px 6px; font-family: var(--sans); }
.card .st .up { color: var(--good); } .card .st .down { color: #ffb4a4; }
.card.tapped { filter: saturate(.35) brightness(.72); transform: rotate(-4deg); }
.card.cand { cursor: pointer; box-shadow: 0 0 0 3px var(--good), 0 0 16px rgba(108,196,138,.55); }
.card.play { cursor: pointer; box-shadow: 0 0 0 3px var(--brass), 0 0 14px rgba(202,162,76,.55); }
.card.sel { box-shadow: 0 0 0 3px var(--brass-hi), 0 0 18px rgba(236,201,109,.7); transform: translateY(-6px); }
.card.atk { border-color: var(--danger); }
.card.atk::before { content: "⚔"; position: absolute; left: 3px; bottom: 2px; font-size: 13px; color: var(--danger); }
.card.big { --w: 250px; font-size: 14px; cursor: default; transform: none; filter: none; }
.card.big .nm { font-size: 18px; } .card.big .cost { font-size: 15px; padding: 1px 7px; }
.card.big .ty { font-size: 12px; padding: 5px 9px 3px; } .card.big .tx { font-size: 15px; padding: 4px 10px; line-height: 1.4; }
.card.big .bd span { font-size: 12px; line-height: 17px; padding: 0 5px; } .card.big .st { font-size: 20px; padding: 2px 10px; bottom: 8px; right: 8px; }
.card.big .hd { padding: 7px 9px 8px; }
.back { width: 46px; height: 64px; border-radius: 6px; border: 2px solid #b48a3c; background: repeating-linear-gradient(45deg, #5e1f22 0 6px, #4a171a 6px 12px); flex: 0 0 auto; box-shadow: 0 2px 4px rgba(0,0,0,.5); }

/* mid rail */
#mid { background: var(--rail); border: 1px solid rgba(202,162,76,.6); box-shadow: 0 6px 20px rgba(0,0,0,.45); border-radius: 12px; padding: 10px 14px; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; position: sticky; top: 0; z-index: 5; }
#mid .turn { font-family: var(--serif); color: var(--brass-hi); font-size: 15px; white-space: nowrap; }
#mid .prompt { flex: 1; min-width: 220px; font-size: 14.5px; line-height: 1.4; }
#mid .btns { display: flex; gap: 8px; flex-wrap: wrap; }
.muted { color: var(--slate); }

/* inspector + log */
#insp { min-height: 360px; display: flex; justify-content: center; align-items: flex-start; }
#insp .hint { color: #eadcc4; font-size: 13px; padding: 16px; text-align: center; line-height: 1.5; background: rgba(20,11,6,.7); border-radius: 10px; }
#log { flex: 1; min-height: 0; overflow: auto; background: rgba(20,11,6,.78); border: 1px solid rgba(232,190,110,.22); border-radius: 10px; padding: 8px 10px; font-size: 12.5px; line-height: 1.45; color: #e6d8bf; }
#log div { padding: 2px 0; border-bottom: 1px solid rgba(255,235,200,.06); }
#log b { color: #fff; font-weight: 600; }
#log .turnlog { color: var(--brass-hi); font-family: var(--serif); font-size: 13.5px; }

/* modals */
.modal { position: fixed; inset: 0; background: rgba(15,8,4,.72); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 20px; }
.modal.pass { background: #1a0e07 var(--table) center / cover no-repeat; }
.modal .box { background: rgba(30,17,9,.96); border: 1px solid var(--brass); border-radius: 14px; padding: 20px 22px; max-width: 900px; width: 100%; max-height: 90vh; overflow: auto; }
.modal h2 { font-family: var(--serif); font-weight: 600; color: var(--parch); margin: 0 0 6px; font-size: 22px; }
.modal p { color: #e6d8bf; margin: 0 0 14px; line-height: 1.45; }
.modal .cards { display: flex; flex-wrap: wrap; gap: 10px; margin: 6px 0 16px; }
.modal .card { --w: 130px; cursor: pointer; }
.modal .ord { position: absolute; top: 34px; left: 6px; background: var(--brass); color: #1d1607; font-weight: 800; border-radius: 50%; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; font-size: 13px; }
.pass .box { max-width: 460px; text-align: center; }

@media (max-width: 980px) {
  #game { grid-template-columns: 1fr; height: auto; }
  .side { padding: 0 10px 10px; }
  #insp { min-height: 0; }
  #log { max-height: 240px; }
  .seats { grid-template-columns: 1fr; }
  .tablerow { grid-template-columns: 1fr; }
  .card { --w: 92px; }
}
@media (prefers-reduced-motion: reduce) { .card { transition: none; } }

/* ---------- hub ---------- */
.hubbar { display: flex; align-items: center; gap: 18px; padding: 12px 20px; background: rgba(24,13,7,.88); border-bottom: 1px solid rgba(202,162,76,.5); position: sticky; top: 0; z-index: 10; flex-wrap: wrap; }
.hubbar .brand { font-family: var(--serif); font-size: 22px; color: var(--parch); font-weight: 600; }
.hubbar nav { display: flex; gap: 6px; flex: 1; flex-wrap: wrap; }
.purse { text-align: right; font-size: 13px; color: #eadcc4; }
.purse .sol { font-family: var(--serif); font-size: 24px; font-weight: 700; color: var(--brass-hi); }
.purse .who { font-size: 12px; color: var(--slate); }
.hub { max-width: 980px; margin: 28px auto; padding: 28px 30px; background: rgba(24,13,7,.84); border: 1px solid rgba(202,162,76,.45); border-radius: 16px; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.hub.wide { max-width: 1280px; }
.hub h1 { font-family: var(--serif); font-weight: 600; color: var(--parch); font-size: 32px; margin: 0 0 8px; }
.h2 { font-family: var(--serif); font-weight: 600; color: var(--parch); font-size: 21px; margin: 22px 0 6px; }
.sub.small, .small { font-size: 14px; }
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; margin-top: 18px; }
.tile { text-align: left; background: rgba(0,0,0,.3); color: #f4eadb; border: 1px solid rgba(202,162,76,.45); padding: 18px; border-radius: 12px; display: flex; flex-direction: column; gap: 6px; font-weight: 400; }
.tile b { font-family: var(--serif); font-size: 22px; color: var(--brass-hi); font-weight: 600; }
.tile:hover:not(:disabled) { background: rgba(202,162,76,.16); }
.record { color: var(--slate); margin-top: 18px; }
.notice { background: rgba(202,162,76,.16); border: 1px solid rgba(202,162,76,.5); border-radius: 8px; padding: 10px 12px; margin: 10px 0; color: #f4eadb; }
.facpick { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; margin: 10px 0 14px; }
.facbtn { text-align: left; background: color-mix(in srgb, var(--fc) 35%, #1a0e07); border: 2px solid color-mix(in srgb, var(--fc) 70%, #000); color: #fff; font-weight: 400; display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; }
.facbtn b { font-family: var(--serif); font-size: 17px; }
.facbtn span { font-size: 12.5px; color: #eadcc4; }
.facbtn.on, .facbtn:hover:not(:disabled) { background: color-mix(in srgb, var(--fc) 60%, #1a0e07); border-color: var(--brass-hi); }
.decklist { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.deckrow { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px 14px; border-radius: 10px; background: rgba(0,0,0,.3); border-left: 6px solid var(--fc); flex-wrap: wrap; }
.deckrow b { font-family: var(--serif); font-size: 18px; display: block; color: var(--parch); }
.deckrow span { font-size: 13px; color: #eadcc4; }
.deckrow .acts { display: flex; gap: 6px; }
.edtop { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.edtop input { flex: 1; min-width: 220px; font: inherit; font-family: var(--serif); font-size: 22px; padding: 6px 10px; border-radius: 8px; border: 1px solid #6b4a2a; background: #1a0f08; color: #fff; }
.count { font-family: var(--serif); font-size: 22px; color: #ffb4a4; } .count.ok { color: var(--good); }
.editor { display: grid; grid-template-columns: minmax(0,1fr) 270px; gap: 16px; margin-top: 10px; }
.pool { display: flex; flex-wrap: wrap; gap: 12px; }
.pcard { display: flex; flex-direction: column; gap: 4px; align-items: center; width: 132px; }
.pcard .card { --w: 132px; }
.pcard.none .card { filter: grayscale(.9) brightness(.55); }
.pcard .own { font-size: 12px; color: #eadcc4; text-align: center; }
.mini { padding: 2px 6px; font-size: 11px; margin-top: 3px; }
.dlist { background: rgba(0,0,0,.3); border-radius: 10px; padding: 10px; align-self: start; position: sticky; top: 80px; max-height: calc(100vh - 100px); overflow: auto; }
.dlist h3 { font-family: var(--serif); margin: 0 0 8px; color: var(--parch); font-weight: 600; }
.dline { display: flex; gap: 6px; align-items: center; width: 100%; text-align: left; margin-bottom: 4px; background: color-mix(in srgb, var(--fc) 30%, #1a0e07); border: 1px solid color-mix(in srgb, var(--fc) 60%, #000); color: #fff; font-weight: 400; padding: 5px 8px; font-size: 13px; border-radius: 6px; }
.dline em { margin-left: auto; font-style: normal; font-size: 12px; }
.dline.mana { background: rgba(255,255,255,.06); border-color: rgba(255,255,255,.12); color: #eadcc4; }
.filters { display: flex; gap: 6px; flex-wrap: wrap; margin: 10px 0 14px; }
.filters .tradeall { margin-left: auto; }
.packoffer { display: flex; gap: 24px; align-items: center; margin-top: 12px; flex-wrap: wrap; }
.pack { width: 130px; height: 184px; border-radius: 10px; border: 3px solid var(--brass); background: repeating-linear-gradient(45deg, #5e1f22 0 8px, #4a171a 8px 16px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; box-shadow: 0 8px 22px rgba(0,0,0,.6); text-align: center; }
.pack span { font-family: var(--serif); font-size: 18px; color: var(--brass-hi); }
.pack b { font-size: 13px; color: #f4eadb; font-weight: 500; }
.reveal { display: flex; gap: 14px; flex-wrap: wrap; }
.rv { position: relative; animation: flipin .5s ease both; }
.rv .card { --w: 150px; }
.newtag { position: absolute; top: -8px; right: -8px; background: var(--good); color: #0e2a17; font-weight: 800; font-size: 12px; padding: 2px 8px; border-radius: 10px; }
@keyframes flipin { from { opacity: 0; transform: rotateY(90deg) scale(.9); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .rv { animation: none; } }
@media (max-width: 980px) { .tiles, .facpick { grid-template-columns: 1fr; } .editor { grid-template-columns: 1fr; } .dlist { position: static; max-height: none; } }
.authtabs { display: flex; gap: 8px; margin: 0 0 12px; }
.seat form, form.seat { display: block; }
form.seat button[type=submit] { margin-top: 6px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #2a170c; border: 1px solid var(--brass); color: #f4eadb; padding: 10px 16px; border-radius: 10px; box-shadow: 0 10px 30px rgba(0,0,0,.6); z-index: 40; max-width: 90vw; }
.atable { width: 100%; border-collapse: collapse; margin-top: 10px; }
.atable th, .atable td { text-align: left; padding: 8px 6px; border-bottom: 1px solid rgba(232,190,110,.2); }
.atable th { color: var(--slate); font-weight: 500; font-size: 13px; }
.atable input { width: 110px; font: inherit; padding: 5px 8px; border-radius: 6px; border: 1px solid #6b4a2a; background: #1a0f08; color: #fff; }
.purse a { color: var(--brass-hi); }

.pricebox { display: flex; align-items: stretch; gap: 10px; margin: 4px 0 10px; flex-wrap: wrap; }
.pricebox > div:not(.op) { flex: 1; min-width: 140px; background: rgba(0,0,0,.3); border: 1px solid rgba(202,162,76,.5); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; }
.pricebox b { font-family: var(--serif); font-size: 26px; color: var(--brass-hi); }
.pricebox span { font-size: 13px; color: #eadcc4; }
.pricebox .op { align-self: center; font-size: 26px; color: var(--brass-hi); font-family: var(--serif); }
.facbtn em { font-style: normal; font-size: 12px; color: var(--brass-hi); margin-top: 2px; }
</style>

<body>
<div id="app"></div>
<script>
"use strict";
// ================= CARD DATA =================
const FAC = {
  Warbound:     { s: '⚔️', c: '#b8412f' },
  Farstrider:   { s: '🧭', c: '#3170c4' },
  Wildborn:     { s: '🌿', c: '#2b8a4f' },
  Shadowmarked: { s: '💀', c: '#55546a' },
  Oathsong:     { s: '🕊️', c: '#c4961c' },
  Lorebound:    { s: '📜', c: '#8a48ab' },
};
const DEFS = {};
let F = '';
function C(id, name, type, g, pips, p, h, text, x) {
  DEFS[id] = Object.assign({ id, name, fac: F, type, g, pips, mv: g + pips, p, h, text, kw: [] }, x || {});
}
const TOK = {
  squire:    { name: 'Squire', fac: 'Oathsong', type: 'Unit', p: 1, h: 1, g: 0, pips: 0, mv: 0, token: true, text: 'A token created by an Oathsong card.', kw: [] },
  illusion:  { name: 'Illusion', fac: 'Farstrider', type: 'Unit', p: 2, h: 2, g: 0, pips: 0, mv: 0, token: true, text: 'When this is targeted by a spell or Reaction, destroy it.', kw: ['illusion'] },
  construct: { name: 'Lore Construct', fac: 'Lorebound', type: 'Unit', p: 3, h: 3, g: 0, pips: 0, mv: 0, token: true, text: 'A token created by Saga of the Sunken Library.', kw: [] },
};

// shared helpers used by card effects
const attackingFilter = u => u.attacking;
const own = p => u => u.ctrl === p;
const enemy = p => u => u.ctrl !== p;
const tgtUnit = (filter, prompt) => async (p, x) => { x.t.a = await pickUnit(p, filter(p), prompt, { src: x.d }); };
const live = u => u && inPlay(u);

// ---------------- WARBOUND ----------------
F = 'Warbound';
C('bloodied_recruit', 'Bloodied Recruit', 'Unit', 0, 1, 2, 1, '');
C('war_drummer', 'War Drummer', 'Unit', 0, 1, 1, 1, 'Whenever you attack, another attacking unit gets +1 Power this turn.', {
  onAnyAttack: async (p, u) => { const t = await pickUnit(p, v => v !== u && v.ctrl === p && v.attacking, 'War Drummer: give another attacking unit +1 Power.'); if (t) t.tp += 1; } });
C('firebrand_bolt', 'Firebrand Bolt', 'Spell', 0, 1, null, null, 'Deal 2 damage to any unit or player.', {
  tgt: async (p, x) => { x.t.a = await pickAny(p, () => true, 'Firebrand Bolt: choose a unit or player.', { src: x.d }); },
  res: async (p, x) => { await hitAny(x.t.a, 2, { p }); } });
C('raider_outrider', 'Raider Outrider', 'Unit', 1, 1, 2, 2, 'Swift', { kw: ['swift'] });
C('shieldbreaker_brute', 'Shieldbreaker Brute', 'Unit', 1, 1, 3, 1, '');
C('pit_fighter', 'Pit Fighter', 'Unit', 1, 1, 2, 2, 'Gets +1 Power while attacking.');
C('battle_cry', 'Battle Cry', 'Spell', 1, 1, null, null, 'Units you control get +1 Power this turn. Draw a card.', {
  res: async p => { P(p).board.forEach(u => u.tp += 1); await draw(p, 1); } });
C('sudden_riposte', 'Sudden Riposte', 'Reaction', 1, 1, null, null, 'Play when your opponent declares attackers. Deal 2 damage to an attacking unit.', {
  when: 'attack', tgt: tgtUnit(() => attackingFilter, 'Sudden Riposte: choose an attacking unit.'),
  res: async (p, x) => { if (live(x.t.a)) dmgUnit(x.t.a, 2, { p }); } });
C('stand_and_fight', 'Stand and Fight', 'Reaction', 1, 1, null, null, 'Play when your opponent declares attackers. A unit you control gets +2 Power and +1 Health this turn.', {
  when: 'attack', can: p => P(p).board.length > 0, tgt: tgtUnit(own, 'Stand and Fight: choose a unit you control.'),
  res: async (p, x) => { if (live(x.t.a)) { x.t.a.tp += 2; x.t.a.th += 1; } } });
C('banner_sergeant', 'Banner Sergeant', 'Unit', 2, 1, 3, 3, 'Your other units get +1 Power while attacking.');
C('ashblade_duelist', 'Ashblade Duelist', 'Unit', 2, 1, 3, 2, 'Swift', { kw: ['swift'] });
C('warcallers_horn', "Warcaller's Horn", 'Relic', 2, 1, null, null, 'The first unit you cast each turn has Swift.');
C('flame_volley', 'Flame Volley', 'Spell', 2, 1, null, null, 'Deal 1 damage to each enemy unit.', {
  res: async p => { [...P(O(p)).board].forEach(u => dmgUnit(u, 1, { p })); } });
C('iron_tusk_charger', 'Iron-Tusk Charger', 'Unit', 3, 1, 4, 3, 'Whenever this attacks, deal 1 damage to the defending player.', {
  onAttack: async (p, u) => { await dmgPlayer(O(p), 1, { unit: u }); } });
C('ravager_captain', 'Ravager Captain', 'Unit', 2, 2, 4, 4, 'When this enters play, deal 2 damage to a unit.', {
  enter: async (p, u) => { const t = await pickUnit(p, v => v !== u, 'Ravager Captain: deal 2 damage to a unit.'); if (t) dmgUnit(t, 2, { p }); } });
C('warpath', 'Warpath', 'Spell', 3, 1, null, null, 'Deal 4 damage to a unit.', {
  can: () => allUnits().length > 0, tgt: tgtUnit(() => () => true, 'Warpath: choose a unit.'),
  res: async (p, x) => { if (live(x.t.a)) dmgUnit(x.t.a, 4, { p }); } });
C('skyfire_wyvern', 'Skyfire Wyvern', 'Unit', 3, 1, 3, 2, 'Flying, Swift', { kw: ['flying', 'swift'] });
C('siegebreaker_ogre', 'Siegebreaker Ogre', 'Unit', 4, 1, 5, 5, "Can't be blocked by units with 2 or less Power.");
C('final_assault', 'Final Assault', 'Spell', 3, 2, null, null, 'Units you control get +2 Power and Swift this turn.', {
  res: async p => { P(p).board.forEach(u => { u.tp += 2; u.tkw.push('swift'); }); } });
C('emberhorn_dragon', 'Emberhorn Dragon', 'Unit', 4, 2, 6, 5, 'Flying. When this enters play, deal 2 damage to any unit or player.', {
  kw: ['flying'], enter: async (p, u) => { const t = await pickAny(p, v => v !== u, 'Emberhorn Dragon: deal 2 damage to a unit or player.'); await hitAny(t, 2, { p }); } });

// ---------------- LOREBOUND ----------------
F = 'Lorebound';
C('apprentice_scribe', 'Apprentice Scribe', 'Unit', 0, 1, 1, 2, 'When this enters play, Prophecy 2.', { enter: async p => prophecy(p, 2) });
C('glyph_of_hesitation', 'Glyph of Hesitation', 'Reaction', 0, 1, null, null, 'Play when your opponent declares attackers. An attacking unit gets -2 Power this turn.', {
  when: 'attack', tgt: tgtUnit(() => attackingFilter, 'Glyph of Hesitation: choose an attacking unit.'),

// ================= ENGINE =================
let G = null, UID = 1, AUTO = null, RNG = Math.random;
class Pause extends Error { constructor(q) { super('pause'); this.q = q; } }
const P = i => G.players[i], O = i => 1 - i;
class GameEnd extends Error {}

function shuffle(a) { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(RNG() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function def(x) { return x.token ? TOK[x.token] : DEFS[x.id]; }
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }
function nm(s) { return '<b>' + esc(s) + '</b>'; }
function log(m) { G.log.unshift(m); if (G.log.length > 400) G.log.length = 400; }
function allUnits() { return [...P(0).board, ...P(1).board]; }
function inPlay(u) { return !!u && G.players.some(pl => pl.board.includes(u)); }
function findUid(uid) { uid = +uid; for (const pl of G.players) for (const z of ['board', 'relics', 'hand', 'well', 'grave']) { const f = pl[z].find(c => c.uid === uid); if (f) return f; } return null; }
function mvOf(u) { return def(u).mv; }
function costStr(c) { const n = c.g ? String(c.g) : (c.pips ? '' : '0'); return n + FAC[c.fac].s.repeat(c.pips); }
function loreCards(p) { return [...P(p).board, ...P(p).relics].filter(c => def(c).fac === 'Lorebound'); }
function runeTotal(p) { return [...P(p).board, ...P(p).relics].reduce((s, c) => s + (c.runes || 0), 0); }
function isBound(u) { return G.players.some(pl => pl.relics.some(r => r.data && r.data.bound === u.uid)); }
function tUnits(w) { return Object.values(w.t || {}).map(v => v && v.u ? v.u : v).filter(v => v && v.ctrl != null && inPlay(v)); }
function isSpellish(d) { return d && (d.type === 'Spell' || d.type === 'Reaction'); }

function hasKw(u, k) {
  const d = def(u);
  if (d.kw.includes(k) || u.tkw.includes(k) || u.pkw.includes(k)) return true;
  if (k === 'venom' && P(u.ctrl).board.some(v => v !== u && v.id === 'poisonmaster_varr')) return true;
  return false;
}

function stats(u, depth = 0) {
  const d = def(u), me = P(u.ctrl);
  let p = d.p + u.counters + u.tp, h = d.h + u.counters + u.th;
  if (d.runeP) p += u.runes;
  if (d.runePH) { p += u.runes; h += u.runes; }
  if (u.id === 'pit_fighter' && u.attacking) p += 1;
  if (u.id === 'wellspring_seeker' && me.well.length >= 5) { p += 1; h += 1; }
  if (u.id === 'keeper_of_pages') { const k = Math.floor(me.well.length / 3); p += k; h += k; }
  if (u.id === 'lancer_of_dawn' && me.board.filter(v => v !== u).length >= 3) p += 1;
  if (u.id === 'pack_stalker' && depth === 0 && me.board.some(v => v !== u && stats(v, 1).p >= 4)) { p += 1; h += 1; }
  for (const v of me.board) {
    if (v === u) continue;
    if (v.id === 'banner_sergeant' && u.attacking) p += 1;
    if (v.id === 'worldroot_colossus') { p += 1; h += 1; }
    if (v.id === 'oathbound_guardian') h += 1;
    if (v.id === 'seraph_first_song') p += 1;
  }
  for (const r of me.relics) if (r.id === 'hymn_of_valor') p += 1;
  if (me.fac === 'Oathsong' && me.hero.awakened) h += 1;
  return { p, h };
}

// ---------- mana ----------
function costOf(p, d) {
  let g = d.g;
  if (d.type === 'Reaction') g = Math.max(0, g - P(p).relics.filter(r => r.id === 'compass_far_roads').length);
  return { g, pips: d.pips, fac: d.fac };
}
function pool(p, ex) { return P(p).well.filter(c => !c.tapped && c.uid !== ex); }
function canAfford(p, cost, ex) {
  const pl = pool(p, ex);
  if (pl.filter(c => def(c).fac === cost.fac).length < cost.pips) return false;
  return pl.length >= cost.g + cost.pips;
}
function pay(p, cost, ex) {
  const pl = pool(p, ex);
  const match = pl.filter(c => def(c).fac === cost.fac);
  const used = match.slice(0, cost.pips);
  const rest = [...pl.filter(c => def(c).fac !== cost.fac), ...match.slice(cost.pips)];
  used.push(...rest.slice(0, cost.g));
  used.forEach(c => c.tapped = true);
}

// ---------- prompts ----------
async function decide(i) {
  if (G.viewer === i) return;
  G.viewer = i;
  if (G.hidden && !AUTO) await new Promise(res => { G.pending = { kind: 'pass', who: i, res }; resetUI(); render(); });
  else render();
}
async function ask(q) {
  if (q.who != null) await decide(q.who);
  if (AUTO) return Promise.resolve().then(() => AUTO(q));
  return new Promise(res => { G.pending = Object.assign({}, q, { res }); resetUI(); render(); });
}
function answer(v) { const q = G.pending; if (!q) return; if (typeof ONLINE !== 'undefined' && ONLINE) return sendAnswer(q, v); G.pending = null; render(); q.res(v); }

async function pickUid(ch, uids, prompt, optional) {
  if (!uids.length) return null;
  if (uids.length === 1 && !optional) return findUid(uids[0]);
  const r = await ask({ kind: 'pick', who: ch, uids, players: [], prompt, optional: !!optional });
  return r && r.uid != null ? findUid(r.uid) : null;
}
async function pickUnit(ch, filter, prompt, o = {}) {
  let c = allUnits().filter(filter);
  if (o.src && isSpellish(o.src)) c = c.filter(u => !(u.ctrl !== ch && def(u).hexproof));
  const u = await pickUid(ch, c.map(u => u.uid), prompt, o.optional);
  if (u && o.src && isSpellish(o.src) && hasKw(u, 'illusion')) {
    log(`${nm(def(u).name)} was targeted and vanished. It was an Illusion.`);
    await destroy(u); return null;
  }
  return u;
}
async function pickAny(ch, filter, prompt, o = {}) {
  let c = allUnits().filter(filter);
  if (o.src && isSpellish(o.src)) c = c.filter(u => !(u.ctrl !== ch && def(u).hexproof));
  const r = await ask({ kind: 'pick', who: ch, uids: c.map(u => u.uid), players: [0, 1], prompt, optional: false });
  if (!r) return null;
  if (r.p != null) return { p: r.p };
  const u = findUid(r.uid);
  if (u && o.src && isSpellish(o.src) && hasKw(u, 'illusion')) { log(`${nm(def(u).name)} was targeted and vanished. It was an Illusion.`); await destroy(u); return null; }
  return u ? { u } : null;
}
async function chooseCards(p, cards, prompt, min, max) {
  if (!cards.length) return [];
  if (min >= cards.length) return [...cards];
  return await ask({ kind: 'cards', who: p, cards: [...cards], prompt, min, max }) || [];
}

// ---------- effects ----------
function gainLife(p, n) { if (n > 0) { P(p).life += n; log(`${esc(P(p).name)} gains ${n} life.`); } }
function loseLife(p, n) { if (n > 0) { P(p).life -= n; log(`${esc(P(p).name)} loses ${n} life.`); } }
function dmgUnit(u, n, src) {
  if (!inPlay(u) || n <= 0) return;
  u.damage += n;
  log(`${nm(def(u).name)} takes ${n} damage.`);
  if (src && src.unit) {
    if (hasKw(src.unit, 'venom')) u.venomed = true;
    if (hasKw(src.unit, 'drain')) gainLife(src.unit.ctrl, n);
  }
}
async function dmgPlayer(i, n, src) {
  if (n <= 0) return;
  P(i).life -= n;
  log(`${esc(P(i).name)} takes ${n} damage.`);
  if (!src) return;
  const sp = src.unit ? src.unit.ctrl : src.p;
  if (sp === O(i)) P(sp).damageTurns.add(G.turn);
  if (src.unit) {
    if (hasKw(src.unit, 'drain')) gainLife(src.unit.ctrl, n);
    if (src.unit.id === 'alley_cutpurse' && P(i).life > 0) await markPick(src.unit.ctrl);
  }
}
async function hitAny(t, n, src) { if (!t) return; if (t.p != null) await dmgPlayer(t.p, n, src); else if (t.u) dmgUnit(t.u, n, src); }
async function draw(p, n) {
  for (let k = 0; k < n; k++) {
    const pl = P(p);
    if (!pl.deck.length) { log(`${esc(pl.name)} has no cards left to draw!`); gameOver(O(p)); }
    pl.hand.push(pl.deck.shift());
  }
}
async function discard(p, n) {
  const pl = P(p); if (!pl.hand.length) return;
  const k = Math.min(n, pl.hand.length);
  const sel = await chooseCards(p, pl.hand, `Discard ${k} card${k > 1 ? 's' : ''}.`, k, k);
  for (const c of sel) { pl.hand.splice(pl.hand.indexOf(c), 1); pl.grave.push(c); log(`${esc(pl.name)} discards ${nm(def(c).name)}.`); }
}
async function prophecy(p, n) {
  const pl = P(p); const top = pl.deck.slice(0, n);
  if (top.length <= 1) return;
  const order = await ask({ kind: 'order', who: p, cards: top, prompt: `Prophecy ${n}: click the cards in the order you want them, first click goes on top.` });
  pl.deck.splice(0, top.length, ...(order && order.length === top.length ? order : top));
  log(`${esc(pl.name)} uses Prophecy ${n}.`);
}
async function inscribe(p, n) {
  for (let k = 0; k < n; k++) {
    const c = loreCards(p);
    const t = await pickUid(p, c.map(x => x.uid), 'Inscribe: choose a Lorebound card you control.', false);
    if (!t) return;
    t.runes += 1; log(`${nm(def(t).name)} gains a rune counter.`);
  }
}
function markUnit(u) { if (inPlay(u) && !u.marked) { u.marked = true; log(`${nm(def(u).name)} is marked.`); } }
async function markPick(p) {
  const opts = P(O(p)).board;
  if (!opts.length) return;
  const fresh = opts.filter(u => !u.marked);
  const t = await pickUid(p, (fresh.length ? fresh : opts).map(u => u.uid), 'Mark an enemy unit.', false);
  if (t) markUnit(t);
}
async function handToWell(p, optional) {
  const pl = P(p);
  const c = await chooseCards(p, pl.hand, 'Put a card from your hand into your Well.', optional ? 0 : 1, 1);
  if (c[0]) { pl.hand.splice(pl.hand.indexOf(c[0]), 1); c[0].tapped = false; pl.well.push(c[0]); log(`${esc(pl.name)} puts a card into their Well.`); }
}
function topToWell(p, n) {
  const pl = P(p); let k = 0;
  for (; k < n && pl.deck.length; k++) { const c = pl.deck.shift(); c.tapped = false; pl.well.push(c); }
  if (k) log(`${esc(pl.name)} puts the top ${k} card${k > 1 ? 's' : ''} of their deck into their Well.`);
}
function leave(x) {
  for (const pl of G.players) {
    let i = pl.board.indexOf(x); if (i >= 0) pl.board.splice(i, 1);
    i = pl.relics.indexOf(x); if (i >= 0) pl.relics.splice(i, 1);
  }
  if (x.token) return null;
  return { uid: UID++, id: x.id, owner: x.owner, tapped: false };
}
function bounce(u) { if (!inPlay(u)) return; const c = leave(u); log(`${nm(def(u).name)} returns to ${esc(P(u.owner).name)}'s hand.`); if (c) P(u.owner).hand.push(c); }
function unitToWell(u) { const c = leave(u); if (c) P(u.owner).well.push(c); }
function relicToWell(r) { const c = leave(r); if (c) P(r.owner).well.push(c); log(`${nm(def(r).name)} finishes and goes into the Well.`); }
async function destroy(u) {
  if (!inPlay(u)) return;
  const marker = O(u.ctrl);
  const c = leave(u);
  log(`${nm(def(u).name)} is destroyed.`);
  if (c) P(u.owner).grave.push(c);
  if (u.marked) {
    P(marker).markedKills++;
    for (const r of P(marker).relics) if (r.id === 'thieves_guild_hall') gainLife(marker, 2);
    if (P(marker).fac === 'Shadowmarked' && P(marker).hero.awakened) await draw(marker, 1);
  }
}
async function mkToken(p, key) {
  const u = { uid: UID++, token: key, owner: p };
  await enterUnit(p, u, {});
}

function freshUnit(c, p) {
  return Object.assign(c, { ctrl: p, damage: 0, counters: 0, runes: 0, marked: false, tapped: false, sick: true, tp: 0, th: 0, tkw: [], pkw: [], noDmg: false, attacking: false, skipUntap: false, venomed: false });
}
async function enterUnit(p, c, o) {
  const pl = P(p); const u = freshUnit(c, p); const d = def(u);
  pl.board.push(u);
  if (o.first && pl.relics.some(r => r.id === 'warcallers_horn')) u.pkw.push('swift');
  log(`${nm(d.name)} enters play for ${esc(pl.name)}.`);
  if (d.enter) await d.enter(p, u);
  for (const v of pl.board) if (v !== u && v.id === 'choir_cantor') gainLife(p, 1);
  if (inPlay(u) && stats(u).p >= 5) for (const r of pl.relics) if (r.id === 'heart_old_grove') await draw(p, 1);
  await checkState();
}
async function enterRelic(p, c) {
  const r = Object.assign(c, { ctrl: p, chapter: 0, runes: 0, data: {} });
  P(p).relics.push(r);
  log(`${nm(def(r).name)} enters play for ${esc(P(p).name)}.`);
  const d = def(r);
  if (d.chapters) { r.chapter = 1; log(`${nm(d.name)}: Chapter I.`); await d.chapters[0](p, r); }
  await checkState();
}
async function advanceChapters(p) {
  for (const r of [...P(p).relics]) {
    const d = def(r);
    if (!d.chapters || !r.chapter || !P(p).relics.includes(r)) continue;
    r.chapter++;
    log(`${nm(d.name)}: Chapter ${['', 'I', 'II', 'III'][r.chapter]}.`);
    await d.chapters[r.chapter - 1](p, r);
    await checkState();
  }
}

function gameOver(w) {
  if (G.over) throw new GameEnd();
  G.over = true; G.winner = w; G.pending = null;
  log(`🏆 ${esc(P(w).name)} wins!`);
  if (typeof onGameEnd === 'function') onGameEnd(w);
  render();
  throw new GameEnd();
}
async function checkState() {
  let again = true;
  while (again) {
    again = false;
    for (const u of allUnits()) {
      const s = stats(u);
      if (s.h <= 0 || u.damage >= s.h || u.venomed) {
        if (u.venomed && u.damage < s.h && s.h > 0) log(`Venom takes effect on ${nm(def(u).name)}.`);
        await destroy(u); again = true; break;
      }
    }
  }
  for (const i of [0, 1]) if (P(i).life <= 0) gameOver(O(i));
  for (const i of [0, 1]) {
    const pl = P(i), h = HEROES[pl.fac];
    if (!pl.hero.awakened && h.aw(i)) { pl.hero.awakened = true; log(`✨ ${nm(h.name)} awakens!`); }
  }
}

// ---------- casting ----------
function canAttack(u) { return !u.tapped && (!u.sick || hasKw(u, 'swift')) && !isBound(u); }
function canBlock(b, a) {
  if (b.tapped || isBound(b)) return false;
  if (hasKw(a, 'unblockable')) return false;
  if (hasKw(a, 'flying') && !hasKw(b, 'flying')) return false;
  if (a.id === 'siegebreaker_ogre' && stats(b).p <= 2) return false;
  return true;

// ---------- combat ----------
async function doAttack(p) {
  const o = O(p), pl = P(p);
  const elig = pl.board.filter(canAttack);
  if (!elig.length) return;
  const sel = await ask({ kind: 'attack', who: p, cands: elig.map(u => u.uid), prompt: 'Click units to attack with, then confirm.' });
  if (!sel || !sel.length) return;
  G.attacked = true;
  const atk = sel.map(findUid).filter(u => u && inPlay(u));
  atk.forEach(u => { u.tapped = true; u.attacking = true; });
  G.combat = { list: atk.map(u => ({ a: u.uid, guard: null, block: null })) };
  log(`${esc(pl.name)} attacks with ${atk.map(u => nm(def(u).name)).join(', ')}.`);
  const guards = () => P(o).board.filter(u => hasKw(u, 'guard'));
  if (guards().length) {
    for (const e of G.combat.list) {
      const gs = guards(); if (!gs.length) break;
      const t = await pickUid(p, gs.map(x => x.uid), `Guard: choose which Guard unit ${nm(def(findUid(e.a)).name)} attacks.`, false);
      if (t) { e.guard = t.uid; log(`${nm(def(findUid(e.a)).name)} must attack ${nm(def(t).name)} (Guard).`); }
    }
  }
  for (const u of atk) if (def(u).onAttack && inPlay(u)) await def(u).onAttack(p, u);
  for (const u of [...pl.board]) if (def(u).onAnyAttack && inPlay(u)) await def(u).onAnyAttack(p, u);
  if (atk.length >= 3) for (const u of [...pl.board]) if (u.id === 'paladin_commander') await draw(p, 1);
  await checkState();
  await reactionWindow('attack', {});
  const list = G.combat.list.filter(e => { const u = findUid(e.a); return u && inPlay(u) && u.attacking; });
  const guardLive = e => e.guard && inPlay(findUid(e.guard));
  const toPlayer = list.filter(e => !guardLive(e));
  const guarded = new Set(list.filter(guardLive).map(e => e.guard));
  const blockers = P(o).board.filter(u => !guarded.has(u.uid));
  const pairs = {};
  for (const e of toPlayer) pairs[e.a] = blockers.filter(b => canBlock(b, findUid(e.a))).map(b => b.uid);
  if (toPlayer.length && Object.values(pairs).some(x => x.length)) {
    G.phase = 'Blocks';
    const asg = await ask({ kind: 'block', who: o, attackers: toPlayer.map(e => e.a), pairs, prompt: `${esc(P(o).name)}: assign blockers. Click one of your units, then the attacker it blocks.` });
    const used = new Set();
    for (const [a, b] of Object.entries(asg || {})) {
      const e = list.find(x => x.a === +a);
      if (e && pairs[e.a] && pairs[e.a].includes(+b) && !used.has(+b)) { e.block = +b; used.add(+b); log(`${nm(def(findUid(+b)).name)} blocks ${nm(def(findUid(e.a)).name)}.`); }
    }
  }
  G.phase = 'Damage';
  const ev = [], retaliated = new Set();
  for (const e of list) {
    const a = findUid(e.a); if (!a || !inPlay(a)) continue;
    const ap = a.noDmg ? 0 : Math.max(0, stats(a).p);
    let dU = null;
    if (guardLive(e)) dU = findUid(e.guard);
    else if (e.block && inPlay(findUid(e.block))) dU = findUid(e.block);
    if (dU) {
      ev.push({ u: dU, n: ap, src: a });
      if (!retaliated.has(dU.uid)) { retaliated.add(dU.uid); ev.push({ u: a, n: Math.max(0, stats(dU).p), src: dU }); }
    } else ev.push({ p: o, n: ap, src: a });
  }
  for (const x of ev) if (x.u) dmgUnit(x.u, x.n, { unit: x.src });
  for (const x of ev) if (x.p != null) await dmgPlayer(x.p, x.n, { unit: x.src });

// ---------- turn flow ----------

      log(def(c).type === 'Mana' ? `${esc(pl.name)} plays ${nm(def(c).name)}.` : `${esc(pl.name)} puts ${nm(def(c).name)} into their Well.`);

    for (const i of order) {

// ================= SERVER-SIDE GAME RUNNER =================
// A game is stored as { seed, cfg, answers[] }. Every request rebuilds the game
// by replaying the human's recorded answers; the computer's choices are recomputed.
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function toWire(q, v) {
  switch (q.kind) {
    case 'cards': case 'order': return (v || []).map(c => c.uid);
    case 'buttons': return q.options.findIndex(o => o[1] === v);
    default: return v === undefined ? null : v;
  }
}
function fromWire(q, w) {
  switch (q.kind) {
    case 'cards': case 'order': return w.map(id => q.cards.find(c => c.uid === id));
    case 'buttons': return q.options[w][1];
    default: return w;
  }
}
function validWire(q, w) {
  const isInt = x => Number.isInteger(x);
  const uniq = a => new Set(a).size === a.length;
  switch (q.kind) {
    case 'main': return w && ['end', 'cast', 'well', 'wellcast', 'power', 'attack'].includes(w.type) && (w.uid === undefined || isInt(w.uid)) && Object.keys(w).every(k => k === 'type' || k === 'uid');
    case 'pick':
      if (w === null) return !!q.optional;
      if (w && isInt(w.uid) && Object.keys(w).length === 1) return q.uids.includes(w.uid);
      if (w && isInt(w.p) && Object.keys(w).length === 1) return (q.players || []).includes(w.p);
      return false;
    case 'attack': return Array.isArray(w) && w.every(isInt) && uniq(w) && w.every(u => q.cands.includes(u));
    case 'react': return w === null || (isInt(w) && q.cards.includes(w));
    case 'block': {
      if (!w || typeof w !== 'object' || Array.isArray(w)) return false;
      const vals = Object.values(w);
      return uniq(vals) && Object.entries(w).every(([a, b]) => q.attackers.includes(+a) && isInt(b) && (q.pairs[a] || []).includes(b));
    }
    case 'buttons': return isInt(w) && w >= 0 && w < q.options.length;
    case 'cards': return Array.isArray(w) && w.every(isInt) && uniq(w) && w.length >= q.min && w.length <= q.max && w.every(id => q.cards.some(c => c.uid === id));
    case 'order': return Array.isArray(w) && w.every(isInt) && uniq(w) && w.length === q.cards.length && w.every(id => q.cards.some(c => c.uid === id));
    case 'reveal': return true;
  }
  return false;
}

// Runs a stored game forward until the human must decide, or the game ends.
async function replayGame(rec) {
  RNG = mulberry32(rec.seed);
  let idx = 0;
  AUTO = q => {
    if (G.ai[q.who]) { const a = aiAnswer(q); return a; }
    if (q.kind === 'reveal' && idx >= rec.answers.length) { /* reveals need an OK from the human */ }
    if (idx < rec.answers.length) return fromWire(q, rec.answers[idx++]);
    throw new Pause(q);
  };
  G = null;
  await newGame(rec.cfg);
  G.pending = G.over ? null : G.paused;
  G.paused = null;
  return G;
}

// ================= UI =================
let UI = {}, INSP = null;
function resetUI() { UI = { sel: null, selWell: false, atk: new Set(), blk: {}, blkSel: null, cards: new Set(), order: [] }; }
resetUI();

function kwLine(o) {
  const d = def(o); const names = { flying: 'Flying', swift: 'Swift', guard: 'Guard', drain: 'Drain', venom: 'Venom', ambush: 'Ambush', unblockable: 'Unblockable', illusion: 'Illusion' };
  return d.kw.filter(k => names[k] && !(d.text || '').includes(names[k])).map(k => names[k]).join(', ');
}
function cardFace(o, big, cls = '') {
  const d = def(o), fc = FAC[d.fac].c, onBoard = o.ctrl != null && (inPlay(o) || (G && G.players.some(pl => pl.relics.includes(o))));
  let st = '';
  if (d.type === 'Unit') {
    if (onBoard && inPlay(o)) {
      const s = stats(o), hp = s.h - o.damage;
      st = `<div class="st"><span class="${s.p > d.p ? 'up' : s.p < d.p ? 'down' : ''}">${s.p}</span>/<span class="${o.damage ? 'down' : s.h > d.h ? 'up' : ''}">${hp}</span></div>`;
    } else st = `<div class="st">${d.p}/${d.h}</div>`;
  }
  const b = [];
  if (onBoard) {
    if (o.runes) b.push(`ᚱ ${o.runes} rune${o.runes > 1 ? 's' : ''}`);
    if (o.counters) b.push(`+${o.counters}/+${o.counters}`);
    if (o.marked) b.push('<span class="mk">Marked</span>');
    if (o.chapter) b.push(`Chapter ${['', 'I', 'II', 'III'][o.chapter]}`);
    if (o.data && o.data.bound) { const t = findUid(o.data.bound); if (t && inPlay(t)) b.push('Binding ' + esc(def(t).name)); }
    if (inPlay(o)) {
      if (o.sick && !hasKw(o, 'swift')) b.push('Just arrived');
      if (isBound(o)) b.push('Bound');
      if (o.skipUntap) b.push('Frozen');
      if (o.noDmg) b.push('Smoked');
      [...new Set([...o.tkw, ...o.pkw])].forEach(k => b.push(k[0].toUpperCase() + k.slice(1)));
      if (!d.kw.includes('venom') && hasKw(o, 'venom') && !o.tkw.includes('venom')) b.push('Venom');
    }
  }
  const kl = kwLine(o);
  const classes = ['card', big ? 'big' : '', cls, onBoard && inPlay(o) && o.tapped ? 'tapped' : ''].join(' ');
  return `<div class="${classes}" style="--fc:${fc}" data-act="card" data-uid="${o.uid || ''}" data-def="${d.token ? '' : d.id}" tabindex="0">`
    + `<div class="hd"><span class="nm">${esc(d.name)}</span>${d.token || d.type === 'Mana' ? '' : `<span class="cost">${costStr(d)}</span>`}</div>`
    + `<div class="ty">${d.token ? 'Token ' : ''}${d.type}${kl ? ' · ' + kl : ''}</div>`
    + `<div class="tx">${esc(d.text || '')}</div>`
    + (b.length ? `<div class="bd">${b.map(x => x.startsWith('<span') ? x : `<span>${x}</span>`).join('')}</div>` : '')
    + st + `</div>`;
}

function candCls(o, zone) {
  const q = G.pending; if (!q || G.over) return '';
  const uid = o.uid;
  if (q.kind === 'pick' && q.uids.includes(uid)) return 'cand';
  if (q.kind === 'react' && q.cards.includes(uid)) return 'cand';
  if (q.kind === 'attack') { if (UI.atk.has(uid)) return 'sel atk'; if (q.cands.includes(uid)) return 'cand'; }
  if (q.kind === 'block') {
    const isBlocker = Object.values(q.pairs).some(l => l.includes(uid));
    if (UI.blkSel === uid) return 'sel';
    if (Object.values(UI.blk).includes(uid)) return 'sel';
    if (q.attackers.includes(uid)) { const c = UI.blk[uid] ? 'atk sel' : 'atk'; return UI.blkSel && q.pairs[uid].includes(UI.blkSel) ? c + ' cand' : c; }
    if (isBlocker) return 'cand';
  }
  if (q.kind === 'main' && zone === 'hand' && q.who === G.viewer) {
    if (UI.sel === uid && !UI.selWell) return 'sel';
    const L = legalMain(q.who); if (L.cast.includes(uid) || (def(o).type === 'Mana' && L.well.includes(uid))) return 'play';
  }
  if (G.combat && inPlay(o) && o.attacking) return 'atk';
  return '';
}

function heroHTML(i, isTop) {
  const pl = P(i), h = HEROES[pl.fac], q = G.pending;
  const cand = q && q.kind === 'pick' && q.players && q.players.includes(i);
  const pw = curPower(i), pc = costStr({ g: pw.g, pips: pw.pips, fac: pl.fac });
  const mine = q && q.kind === 'main' && q.who === i && !isTop && !UI.sel;
  const L = mine ? legalMain(i) : null;
  const power = L ? `<button data-act="power" ${L.power ? '' : 'disabled'} title="Once per turn">Hero power (${pc}): ${esc(pw.label)}</button>`
    : `Hero power (${pc}): ${esc(pw.label)}${pl.hero.used && G.active === i ? ' <span class="muted">(used this turn)</span>' : ''}`;
  return `<div class="hero ${cand ? 'cand' : ''}" style="--fc:${FAC[pl.fac].c}" data-act="player" data-p="${i}">`
    + `<div class="life ${pl.life <= 5 ? 'low' : ''}" title="Life">${pl.life}</div>`
    + `<div class="hname">${esc(h.name)}${pl.hero.awakened ? '<span class="badge-aw">Awakened</span>' : ''}</div>`
    + `<div class="who">${esc(pl.name)}, ${pl.fac}${G.active === i ? ' (their turn)' : ''}</div>`
    + `<div class="pw">${power}</div>`
    + (pl.hero.awakened ? (h.awPassive ? `<div class="awk">${esc(h.awPassive)}</div>` : '') : `<div class="awk"><b>Awaken:</b> ${esc(h.awText)} (${h.prog(i)})</div>`)
    + `<div class="zones">Deck ${pl.deck.length}, hand ${pl.hand.length}, graveyard ${pl.grave.length}</div></div>`;
}
function wellHTML(i) {
  const pl = P(i), q = G.pending, ready = pl.well.filter(c => !c.tapped).length;
  const L = q && q.kind === 'main' && q.who === i && i === G.viewer ? legalMain(i) : null;
  const counts = {}; pl.well.forEach(c => { if (!c.tapped) { const f = def(c).fac; counts[f] = (counts[f] || 0) + 1; } });
  const mana = Object.entries(counts).map(([f, n]) => `${n}${FAC[f].s}`).join(' ');
  return `<div class="well"><div class="wl">Well: <b>${ready}</b> of ${pl.well.length} ready ${mana ? '(' + mana + ')' : ''}${pl.wellPlays && G.active === i ? ', card added this turn' : ''}</div><div class="wtiles">`
    + (pl.well.length ? pl.well.map(c => {
      const cand = (L && L.wellcast.includes(c.uid)) || (q && q.kind === 'pick' && q.uids.includes(c.uid));
      return `<div class="wt ${c.tapped ? 'tap' : ''} ${cand ? 'cand' : ''}" style="--fc:${FAC[def(c).fac].c}" data-act="well" data-uid="${c.uid}" data-def="${c.id}">${esc(def(c).name)}</div>`;
    }).join('') : '<span class="muted">Empty. Put one card here each turn to make mana.</span>') + `</div></div>`;
}
function areaHTML(i, isTop) {
  const pl = P(i);
  let hand;
  if (isTop) {
    hand = G.hidden ? (pl.hand.length ? `<div class="ohand">${pl.hand.map(() => '<div class="back"></div>').join('')}</div>` : '')
      : (pl.hand.length ? `<div class="ohand wtiles">${pl.hand.map(c => `<div class="wt" style="--fc:${FAC[def(c).fac].c}" data-uid="${c.uid}" data-def="${c.id}">${esc(def(c).name)}</div>`).join('')}</div>` : '');
  } else hand = `<div class="row handrow">${pl.hand.map(c => cardFace(c, false, candCls(c, 'hand'))).join('') || '<span class="muted">No cards in hand.</span>'}</div>`;
  const relics = pl.relics.map(r => cardFace(r, false, candCls(r, 'relic'))).join('');
  const units = pl.board.map(u => cardFace(u, false, candCls(u, 'board'))).join('');
  const board = `<div class="row battlefield ${pl.board.length || pl.relics.length ? '' : 'empty'}" data-empty="${esc(pl.name)}'s battlefield is empty.">${relics}${relics && units ? '<div class="sep"></div>' : ''}${units}</div>`;
  const col = `<div class="hcol">${heroHTML(i, isTop)}${wellHTML(i)}${isTop ? hand : ''}</div>`;
  return `<section class="parea ${isTop ? 'top' : 'bottom'}"><div class="tablerow">${col}${board}</div>${isTop ? '' : hand}</section>`;
}
function midHTML() {
  const q = G.pending, a = P(G.active);
  let prompt = '', btns = '';
  if (G.over) { prompt = `<b>${esc(P(G.winner).name)} wins!</b> ${G.rewardText ? esc(G.rewardText) : ''}`; btns = `<button data-act="home">Back to home</button>`; }
  else if (q) {
    const who = q.who != null ? esc(P(q.who).name) : '';
    switch (q.kind) {
      case 'main': {
        const L = legalMain(q.who);
        if (UI.sel) {
          const c = findUid(UI.sel), d = def(c), cs = costStr(costOf(q.who, d));
          prompt = `${nm(d.name)}: what would you like to do?`;
          if (UI.selWell) btns += `<button data-act="wellcast">Cast from Well (${cs})</button>`;
          else {
            if (d.type === 'Mana') {
              if (L.well.includes(UI.sel)) btns += `<button data-act="towell">Play ${esc(d.name)}</button>`;
              else prompt += ' <span class="muted">You\u2019ve already added a card to your Well this turn.</span>';
            } else {
              if (L.cast.includes(UI.sel)) btns += `<button data-act="cast">Cast (${cs})</button>`;
              else prompt += ` <span class="muted">${d.type === 'Reaction' ? 'Reactions are played during your opponent’s turn.' : 'You can’t cast this right now.'}</span>`;
              if (L.well.includes(UI.sel)) btns += `<button data-act="towell" class="ghost">Use as mana (put into Well)</button>`;
            }
          }
          btns += `<button data-act="unsel" class="ghost">Back</button>`;
        } else {
          prompt = `${who}, it's your main phase. Click a card in your hand to cast it or add it to your Well.`;
          if (L.attack) btns += `<button data-act="attack">Attack</button>`;
          btns += `<button data-act="end" class="ghost">End turn</button>`;
        }
        break;
      }
      case 'pick': prompt = q.prompt + (q.players && q.players.length ? ' <span class="muted">Click a highlighted unit or hero.</span>' : ' <span class="muted">Click a highlighted card.</span>'); if (q.optional) btns = `<button data-act="skip" class="ghost">Skip</button>`; break;
      case 'attack': prompt = `${q.prompt} <span class="muted">${UI.atk.size} selected.</span>`; btns = `<button data-act="confirmAttack" ${UI.atk.size ? '' : 'disabled'}>Attack with ${UI.atk.size}</button><button data-act="cancelAttack" class="ghost">Cancel</button>`; break;
      case 'react': prompt = `${q.prompt} <span class="muted">Click a highlighted card to play it.</span>`; btns = `<button data-act="done" class="ghost">Don't respond</button>`; break;
      case 'block': prompt = q.prompt + (UI.blkSel ? ' <span class="muted">Now click the attacker it blocks.</span>' : ''); btns = `<button data-act="confirmBlock">Confirm blocks</button>`; break;
      case 'buttons': prompt = q.prompt; btns = q.options.map((o, k) => `<button data-act="opt" data-k="${k}" ${k ? 'class="ghost"' : ''}>${esc(o[0])}</button>`).join(''); break;
      default: prompt = q.prompt || '';
    }
  } else prompt = '<span class="muted">The computer is thinking…</span>';
  if (typeof ONLINE !== 'undefined' && !G.over) btns += `<button data-act="forfeit" class="ghost" title="Counts as a loss">Forfeit</button>`;
  return `<div id="mid"><div class="turn">Turn ${G.turn || 0}, ${esc(a.name)}</div><div class="prompt">${prompt}</div><div class="btns">${btns}</div></div>`;
}
function modalHTML() {
  const q = G.pending; if (!q || G.over) return '';
  if (q.kind === 'pass') { const n = esc(P(q.who).name); return `<div class="modal pass"><div class="box"><h2>Pass to ${n}</h2><p>The other player looks away. ${n}, click when you're ready to see your cards.</p><button data-act="passok">Show ${n}'s cards</button></div></div>`; }
  if (q.kind === 'cards') {
    const ok = UI.cards.size >= q.min && UI.cards.size <= q.max;
    return `<div class="modal"><div class="box"><h2>Choose ${q.min === q.max ? q.min : (q.min ? q.min + ' to ' + q.max : 'up to ' + q.max)}</h2><p>${q.prompt}</p><div class="cards">${q.cards.map(c => cardFace(c, false, UI.cards.has(c.uid) ? 'sel' : 'cand').replace('data-act="card"', 'data-act="mcard"')).join('')}</div><button data-act="mconfirm" ${ok ? '' : 'disabled'}>Confirm</button></div></div>`;
  }
  if (q.kind === 'order') {
    return `<div class="modal"><div class="box"><h2>Prophecy</h2><p>${q.prompt}</p><div class="cards">${q.cards.map(c => { const k = UI.order.indexOf(c.uid); return `<div style="position:relative">${cardFace(c, false, k >= 0 ? 'sel' : 'cand').replace('data-act="card"', 'data-act="ocard"')}${k >= 0 ? `<div class="ord">${k + 1}</div>` : ''}</div>`; }).join('')}</div><button data-act="oconfirm" ${UI.order.length === q.cards.length ? '' : 'disabled'}>Put back in this order</button> <button data-act="oreset" class="ghost">Start over</button></div></div>`;
  }
  if (q.kind === 'reveal') return `<div class="modal"><div class="box"><h2>Revealed</h2><p>${q.prompt}</p><div class="cards">${q.cards.length ? q.cards.map(c => cardFace(c, false).replace('data-act="card"', 'data-act="x"')).join('') : '<span class="muted">Their hand is empty.</span>'}</div><button data-act="ok">Done</button></div></div>`;
  return '';
}

function heroPreview(f) { const h = HEROES[f]; return `<b>${esc(h.name)}</b>, ${h.life} life. Power: ${esc(h.power.label)}. Awakens when: ${esc(h.awText.toLowerCase())}.`; }
function setupHTML() {
  const facs = Object.keys(HEROES);
  const sel = (i, d) => `<select id="d${i}" data-act="deckpick">${facs.map(f => `<option value="${f}" ${f === d ? 'selected' : ''}>${f}: ${esc(HEROES[f].name)}</option>`).join('')}</select>`;
  return `<div class="setup"><h1>Untitled TCG</h1><p class="sub">A playable prototype of the six starter decks (55 cards each). Two players share one screen and take turns.</p>
  <div class="seats">
    <div class="seat"><label for="n0">Player 1 name</label><input id="n0" value="Player 1"><label for="d0">Deck</label>${sel(0, 'Warbound')}<div class="hp" id="hp0">${heroPreview('Warbound')}</div></div>
    <div class="seat"><label for="n1">Player 2 name</label><input id="n1" value="Player 2"><label for="d1">Deck</label>${sel(1, 'Lorebound')}<div class="hp" id="hp1">${heroPreview('Lorebound')}</div></div>
  </div>
  <label class="chk"><input type="checkbox" id="hid" checked> Hide each player's hand from the other. The screen asks you to pass the device whenever the other player needs to make a choice.</label>
  <button data-act="start">Start game</button>
  <div class="quick"><h2>How a turn works</h2><ol>
    <li>Your units and Well untap, and you draw a card.</li>
    <li>Once per turn, play a Mana card into your Well. No Mana card? Put any other card in instead. Each Well card makes 1 mana of its faction.</li>
    <li>Cast cards, use your hero power once, and attack once. Click a card in your hand to see your options.</li>
    <li>Your opponent can answer with Reactions when you cast a card or attack, and chooses blockers.</li>
    <li>Bring the other hero to 0 life to win. Hover any card to read it in full on the right.</li>
  </ol></div></div>`;
}

function render() {
  if (typeof document === 'undefined') return;
  const app = document.getElementById('app');
  if (!G) { app.innerHTML = hubHTML(); return; }
  const v = G.viewer, t = O(v);
  const insp = INSP ? cardFace(INSP, true) : '<div class="hint">Hover over any card to read it here at full size.</div>';
  app.innerHTML = `<div id="game"><main id="board">${areaHTML(t, true)}${midHTML()}${areaHTML(v, false)}</main>`
    + `<aside class="side"><div id="insp">${insp}</div><div id="log" aria-live="polite">${G.log.map(l => `<div>${l}</div>`).join('')}</div></aside></div>${modalHTML()}`
    + (typeof TOAST !== 'undefined' && TOAST ? `<div class="toast" role="status">${esc(TOAST)}</div>` : '');
}

function onClick(e) {
  const el = e.target.closest('[data-act]'); if (!el) return;
  const act = el.dataset.act;
  if (act === 'start') { startRanked(); return; }
  if (act === 'logout' && e.preventDefault) e.preventDefault();
  if (act === 'home' || act === 'forfeit' || (!G && typeof hubClick === 'function')) { if (hubClick(el, act)) return; }
  if (!G || !G.pending) return;
  const q = G.pending, uid = el.dataset.uid ? +el.dataset.uid : null;
  switch (act) {
    case 'passok': if (q.kind === 'pass') answer(); break;
    case 'card': cardClick(uid); break;
    case 'well':
      if (q.kind === 'main' && q.who === G.viewer && legalMain(q.who).wellcast.includes(uid)) { UI.sel = uid; UI.selWell = true; render(); }
      else if (q.kind === 'pick' && q.uids.includes(uid)) answer({ uid });
      break;
    case 'player': if (q.kind === 'pick' && q.players && q.players.includes(+el.dataset.p)) answer({ p: +el.dataset.p }); break;
    case 'power': if (q.kind === 'main') answer({ type: 'power' }); break;
    case 'attack': if (q.kind === 'main') answer({ type: 'attack' }); break;
    case 'end': if (q.kind === 'main') answer({ type: 'end' }); break;
    case 'cast': answer({ type: 'cast', uid: UI.sel }); break;
    case 'towell': answer({ type: 'well', uid: UI.sel }); break;
    case 'wellcast': answer({ type: 'wellcast', uid: UI.sel }); break;
    case 'unsel': UI.sel = null; UI.selWell = false; render(); break;
    case 'skip': answer(null); break;
    case 'confirmAttack': answer([...UI.atk]); break;
    case 'cancelAttack': answer([]); break;
    case 'done': answer(null); break;
    case 'confirmBlock': answer(Object.assign({}, UI.blk)); break;
    case 'opt': answer(q.options[+el.dataset.k][1]); break;
    case 'mcard': if (q.kind === 'cards') { if (UI.cards.has(uid)) UI.cards.delete(uid); else { if (q.max === 1) UI.cards.clear(); if (UI.cards.size < q.max) UI.cards.add(uid); } render(); } break;
    case 'mconfirm': answer(q.cards.filter(c => UI.cards.has(c.uid))); break;
    case 'ocard': if (!UI.order.includes(uid)) { UI.order.push(uid); render(); } break;
    case 'oreset': UI.order = []; render(); break;
    case 'oconfirm': answer(UI.order.map(u => q.cards.find(c => c.uid === u))); break;
    case 'ok': answer(); break;
  }
}
function cardClick(uid) {
  const q = G.pending, c = findUid(uid); if (!c) return;
  if (q.kind === 'main' && q.who === G.viewer && P(G.viewer).hand.includes(c)) { UI.sel = uid; UI.selWell = false; render(); return; }
  if (q.kind === 'react' && q.cards.includes(uid)) { answer(uid); return; }
  if (q.kind === 'pick' && q.uids.includes(uid)) { answer({ uid }); return; }
  if (q.kind === 'attack' && q.cands.includes(uid)) { UI.atk.has(uid) ? UI.atk.delete(uid) : UI.atk.add(uid); render(); return; }
  if (q.kind === 'block') {
    const isBlocker = Object.values(q.pairs).some(l => l.includes(uid));
    if (isBlocker) {
      for (const [a, b] of Object.entries(UI.blk)) if (b === uid) { delete UI.blk[a]; UI.blkSel = null; render(); return; }
      UI.blkSel = UI.blkSel === uid ? null : uid; render(); return;
    }
    if (q.attackers.includes(uid) && UI.blkSel && q.pairs[uid].includes(UI.blkSel)) { UI.blk[uid] = UI.blkSel; UI.blkSel = null; render(); return; }
  }
}
function onHover(e) {
  if (!G) return;
  const el = e.target.closest('.card,.wt'); if (!el || el.classList.contains('big')) return;
  let o = el.dataset.uid ? findUid(+el.dataset.uid) : null;
  if (!o && G.pending && G.pending.cards) o = G.pending.cards.find(c => c.uid === +el.dataset.uid) || null;
  if (!o && el.dataset.def) o = { id: el.dataset.def };
  if (!o || o === INSP) return;
  INSP = o;
  const b = document.getElementById('insp'); if (b) b.innerHTML = cardFace(o, true);
}
function onChange(e) {
  const m = e.target.id && e.target.id.match(/^d(\d)$/);
  if (m) { const hp = document.getElementById('hp' + m[1]); if (hp) hp.innerHTML = heroPreview(e.target.value); }
}
function onKey(e) {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('.card[tabindex]')) { e.preventDefault(); onClick({ target: e.target }); }
}
if (typeof document !== 'undefined') {
  document.addEventListener('click', onClick);
  document.addEventListener('mouseover', onHover);
  document.addEventListener('focusin', onHover);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKey);
  render();
  initAccount();
}
</script>
</body>
</html>
